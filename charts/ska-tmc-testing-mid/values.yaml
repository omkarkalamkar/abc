display: ":0"
xauthority: "~/.Xauthority"

legacy_compatibility: true

global:
  dishids: &dish_ids ["SKA001", "SKA036", "SKA077", "SKA099", "SKA100","SKA999","SKA500"]

  # List the dishes, if set, then this list will be applied to instances of:
  # deviceServers.dishmaster, deviceServers.dishleafnode
  dishes: ["001", "036", "077", "100"]
    
  retry: 
  - "--sleep=1"
  - "--tries=100"
  sub-system:
    ska-tango-util:
      enabled: false
    ska-tango-base:
      enabled: false
    ska-tango-taranta:
      enabled: false
  tango_host: databaseds-tango-base-test:10000
  dsconfig:
    timeout: 300s
    image:
      registry: artefact.skao.int
      image: ska-tango-images-tango-dsconfig
      tag: 1.5.7
      pullPolicy: IfNotPresent
  itango:
    image:
      registry: artefact.skao.int
      image: ska-cicd-k8s-tools-build-deploy
      tag: 0.13.4
      pullPolicy: IfNotPresent
  sdp:
    processingNamespace: ska-tmc-integration-sdp


ska-tango-base:
  enabled: true
  vnc:
    replicas: 1
    enabled: false
  tangorest:
    enabled: false
    replicas: 1
  tangodb:
    use_pv: false

ska-taranta:
  enabled: false

# Tmc-Mid
tmc-mid:

  labels:
    app: ska-tmc-integration
  enabled: true

  deviceServers:
    centralnode:
      enabled: true
      instances: ["01"]
      subarray_count: 1
      file: "data/centralnode_mid.yaml"
      DishIDs: *dish_ids
      DishVccConfig:
        DishVccUri: "car://gitlab.com/ska-telescope/ska-tmc/ska-tmc-simulators?1.13.2#tmdata"
        DishVccFilePath: "instrument/dishid_vcc_map_configuration/ska-mid-cbf-system-parameters.json"
        Enabled: "true"
        DishKvalueAggregationAllowedPercent: "100.0"
      KValueValidRange:
        min: 1
        max: 1177
      CommandTimeOutDefault: 120
      DishVccInitTimeout: 180
      LivelinessCheckPeriod: 2.0
      EventSubscriptionCheckPeriod: 2.0
      DefaultArrayLayoutSourceURIs: "gitlab://gitlab.com/ska-telescope/ska-telmodel-data?main#tmdata"
      DefaultArrayLayoutPath: "instrument/ska1_mid/layout/mid-layout.json"
      family: "central-node"
      member: "0"
      global_pointing_model:
        version: "1.13.2"
        interface: "https://schema.skao.int/ska-mid-dish-gpm/1.2"
        data_sources_prefix: "gitlab://gitlab.com/ska-telescope/ska-tmc/ska-tmc-simulators"
        file_path_prefix: "instrument/ska_mid1/global_pointing_model_data"
      LoggingLevel: "5"
      SubarrayPrefix: "mid-tmc/subarray/"

    subarraynode:
      enabled: true
      file: "data/subarraynode_mid.yaml"
      DishIDs: *dish_ids
      CspAssignResourcesInterfaceURL: "https://schema.skao.int/ska-csp-assignresources/3.1"
      CspScanInterfaceURL: "https://schema.skao.int/ska-csp-scan/2.2"
      SdpScanInterfaceURL: "https://schema.skao.int/ska-sdp-scan/1.1"
      TelmodelSource: "car://gitlab.com/ska-telescope/ska-telmodel-data?main#tmdata"
      TelmodelPath: "instrument/ska1_mid/layout/mid-layout.json"
      CommandTimeOutDefault: 110
      AbortCommandTimeOut: 130
      LivelinessCheckPeriod: 1.5
      EventSubscriptionCheckPeriod: 1.5
      family: "subarray"
      ScanStartTimeOffset: 10
      StartTimeEnabled: false
      resources:
        limits:
          cpu: 600m
          memory: 1000Mi
        requests:
          cpu: 400m
          memory: 300Mi
      LoggingLevel: "5"

    sdpsubarrayleafnode:
      LoggingLevel: "5"

    sdpmasterleafnode:
      LoggingLevel: "5"

    cspmasterleafnode:
      LoggingLevel: "5"

    cspsubarrayleafnode:
      LoggingLevel: "5"

    dishleafnode:
      max_allowed_wind_speed: 20
      max_allowed_ops_wind_speed: 20
      max_allowed_gust_wind_speed: 40
      max_allowed_wind_speed_difference: 4.5
      wind_speed_measurement_time_window: 1000
      gust_wind_speed_measurement_time_window: 3
      mean_wind_speed_measurement_time_window: 600
      max_allowed_ops_mean_wind_speed_measurement_time_window: 600
      max_temp_threshold: 60.0
      min_temp_threshold: -10
      time_delta: 1000.0
      temp_delta: 40.0
      enable_auto_stow: true
      LoggingLevel: "5"

    dishpointingdevice:
      LoggingLevel: "5"

    resourcemonitor:
      enabled: true
      instances: ["01"]
      file: "data/resourcemonitor.yaml"
      LivelinessCheckPeriod: 1.0
      EventSubscriptionCheckPeriod: 1.0
      family: "resource-monitor"
      DishLeafNodePrefix: "mid-tmc/leaf-node-dish/"
      SubarrayPrefix: "mid-tmc/subarray/"
      DishType: "SKA"
      DishIDs: *dish_ids
      MidSubarrayNodeFQDNs: ["mid-tmc/subarray/01", "mid-tmc/subarray/02"]
      LoggingLevel: "5"

    mocks:
      enabled: true
      dish: true
      csp: true
      sdp: true

ska-sdp:
  resources:
    limits:
      memory: 200Mi
      cpu: 0.1
    requests:
      memory: 100Mi
      cpu: 0.2
  enabled: false
  lmc:
    resources:
      limits:
        memory: 500Mi
        cpu: 0.5
      requests:
        memory: 100Mi
        cpu: 0.3
    prefix: mid
    nsubarray: 1
  data-pvc:
    create:
      enabled: true
      size: 100Mi
      storageClassName: nfss1
  ska-tango-base:
    enabled: false

# SKUID
ska-ser-skuid:
  labels:
    app: ska-tmc-integration
  enabled: true
  skuid:
    use_pv: false
    config:
      generator_id: mvp01
  
ska-tango-alarmhandler:
  labels: 
    app: ska-tmc-integration
  enabled: true
  legacy_compatibility: true


ska-csp-lmc-mid:
  labels: 
    app: ska-tmc-integration
  enabled: false

ska-mid-cbf-mcs:
  labels: 
    app: ska-tmc-integration

ska-mid-cbf-tmleafnode:
  labels: 
    app: ska-tmc-integration

ska-tango-tangogql-ariadne:
  enabled: true
  ska-tango-base:
    enabled: false

ska-tango-tangogql:
  ska-tango-base:
    enabled: false

simulator:
  enabled: true
  name: wms-sim
  containers:
    registry: registry.gitlab.com
    image: ska-telescope/ska-mid-wms-interface/ska-mid-wms-interface
    tag: 966329b7
    pullPolicy: IfNotPresent

mid_wms:
  deviceServers:
    wms:
      station_ids: ["s1", "s2"]
      modbus_server_hostnames: ["wms-sim-s1", "wms-sim-s2"]
      modbus_server_ports: ["1502", "1502"]
  labels:
    app: ska-tmc-integration
  enabled: true
  ska-tango-base:
    enabled: false
  simulator:
    enabled: false

