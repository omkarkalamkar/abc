on-demand-dish-lmc-extended-dish-ids:
  stage: on-demand
  tags:
    - ska-k8s
  variables:
    KUBE_NAMESPACE: "ci-$CI_PROJECT_NAME-$CI_COMMIT_SHORT_SHA-on-demand-dish-lmc-extended"
    DISH_LMC_SERVICE_ACCOUNT: "ci-svc-$CI_PROJECT_NAME-$CI_COMMIT_SHORT_SHA-on-demand-dish-lmc-extended"
    DISH_HELM_RELEASE: "7.0.1"
    K8S_DISH_LMC_CHART: "ska-dish-lmc"
    TARANTA_ENABLED: "true"
  script:
    - make k8s-install-chart-car KUBE_NAMESPACE=$KUBE_NAMESPACE K8S_CHART_PARAMS='-f charts/dish_lmc_values.yml
      --set "global.dishes={198,500,999}" --version=7.0.1
      --set global.cluster_domain=$(CLUSTER_DOMAIN)'
      HELM_RELEASE=$DISH_HELM_RELEASE K8S_CHART=$K8S_DISH_LMC_CHART
    - make k8s-wait
  environment:
    name: test/od-extended-dish-ids-$CI_COMMIT_REF_SLUG
    on_stop: stop-on-demand-dish-lmc-extended
  allow_failure: true
  when: manual


