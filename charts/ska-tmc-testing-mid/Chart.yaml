apiVersion: v2
name: ska-tmc-testing-mid
description: An umbrella Helm chart for SKA-TMC-Mid deployment.
type: application
version: 0.0.2
appVersion: 1.16.0
icon: https://www.skatelescope.org/wp-content/uploads/2016/07/09545_NEW_LOGO_2014.png
maintainers:
  - name: Team Sahyadri, Team Himalay
    email: telmgt-internal@googlegroups.com
dependencies:
  - name: ska-tango-base
    version: 1.0.6
    repository: https://artefact.skao.int/repository/helm-internal
  - name: ska-tango-util
    version: 1.0.6
    repository: https://artefact.skao.int/repository/helm-internal
  - name: ska-tmc-mid
    version: 1.18.0-rc.3
    repository: file://../ska-tmc-mid
    alias: tmc-mid
  - name: ska-sdp
    version: 1.1.0
    repository: https://artefact.skao.int/repository/helm-internal
    condition: ska-sdp.enabled
  - name: ska-ser-skuid
    version: 0.3.0
    repository: https://artefact.skao.int/repository/helm-internal
    condition: ska-ser-skuid.enabled
  - name: ska-tango-alarmhandler
    version: 0.4.0
    repository: https://artefact.skao.int/repository/helm-internal
    condition: ska-tango-alarmhandler.enabled
  - name: ska-tango-taranta
    version: 2.14.1
    repository: https://artefact.skao.int/repository/helm-internal
    condition: ska-taranta.enabled
  - name: ska-tango-tangogql
    version: 1.4.8
    repository: https://artefact.skao.int/repository/helm-internal
    condition: ska-taranta.enabled
  - name: ska-csp-lmc-mid
    version: 0.24.1-rc.1
    repository: https://artefact.skao.int/repository/helm-internal
    condition: ska-csp-lmc-mid.enabled
  - name: ska-mid-cbf-mcs
    version: 1.1.0-rc.2
    repository: https://artefact.skao.int/repository/helm-internal
    condition: ska-csp-lmc-mid.enabled
  - name: ska-k8s-config-exporter
    version: 0.0.4
    repository: https://artefact.skao.int/repository/helm-internal
    condition: ska-k8s-config-exporter.enabled
  - name: ska-mid-wms
    version: 1.0.1
    repository: https://artefact.skao.int/repository/helm-internal
    condition: ska-mid-wms.enabled
    alias: mid_wms

