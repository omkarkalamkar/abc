# GitLab CI in conjunction with GitLab Runner can use Docker Engine to test and build any application.
# Docker, when used with GitLab CI, runs each job in a separate and isolated container using the predefined image that is set up in .gitlab-ci.yml.
# In this case we use the latest python docker image to build and test this project.
image: $SKA_K8S_TOOLS_DOCKER_BUILDER_IMAGE

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  DOCKER_DRIVER: overlay2
  DOCS_RTD_PROJECT_SLUG: ska-telescope-ska-tmc-integration

# cache is used to specify a list of files and directories which should be cached between jobs. You can only use paths that are within the project workspace.
# If cache is defined outside the scope of jobs, it means it is set globally and all jobs will use that definition
cache:
  paths:
    - build

# The YAML file defines a set of jobs with constraints stating when they should be run.
# You can specify an unlimited number of jobs which are defined as top-level elements with an arbitrary name and always have to contain at least the script clause.
# In this case we have only the test job which produce an artifacts (it must be placed into a directory called "public")
# It is also specified that only the master branch will be subject of this job.

stages:
  - lint
  - build
  - scaling
  - on-demand
  - pair-wise-tests
  - test
  - integration
  - publish
  - staging
  - pages
  - scan
  - lifecycle

include:
  # Docs Pages
  - project: "ska-telescope/templates-repository"
    file: "gitlab-ci/includes/docs.gitlab-ci.yml"

  # # Release Automation
  - project: "ska-telescope/templates-repository"
    file: "gitlab-ci/includes/release.gitlab-ci.yml"

  # # Python packages build,lint, test and publish
  - project: "ska-telescope/templates-repository"
    file: "gitlab-ci/includes/python-lint.gitlab-ci.yml"

  # # # Helm Chart linting and Publish
  - project: "ska-telescope/templates-repository"
    file: "gitlab-ci/includes/helm-chart.gitlab-ci.yml"

  # k8s steps
  - project: "ska-telescope/templates-repository"
    file: "gitlab-ci/includes/k8s.gitlab-ci.yml"

  # integration job
  - project: "ska-telescope/templates-repository"
    file: "gitlab-ci/includes/deploy.integration.gitlab-ci.yml"

  # staging job
  - project: "ska-telescope/templates-repository"
    file: "gitlab-ci/includes/deploy.staging.gitlab-ci.yml"

  # Create Gitlab CI badges from CI metrics
  # https://developer.skatelescope.org/en/latest/tools/continuousintegration.html#automated-collection-of-ci-health-metrics-as-part-of-the-ci-pipeline
  - project: "ska-telescope/templates-repository"
    file: "gitlab-ci/includes/finaliser.gitlab-ci.yml"

  # # Publish bdd test results on Jira.
  # - project: 'ska-telescope/templates-repository'
  #   file: 'gitlab-ci/includes/xray-publish.gitlab-ci.yml'

  - local: "/gitlab_ci/.gitlab-ci-tmc-csp-new-ith.yml"
  - local: "/gitlab_ci/.gitlab-ci-on-demand.yml"
  - local: "/gitlab_ci/.gitlab-ci-dish.yml"
  - local: "/gitlab_ci/.gitlab-ci-csp-dish.yml"
  - local: "/gitlab_ci/.gitlab-ci-integration.yml"
  - local: "/gitlab_ci/.gitlab-ci-staging.yml"

k8s-test:
  variables:
    SERVICE_ACCOUNT: "ci-svc-$CI_PROJECT_NAME-$CI_COMMIT_SHORT_SHA"
    DISH_SIMULATION_ENABLED: "true"
    SUBARRAY_COUNT: 2
    SUBARRAY_COMMAND_TIMEOUT: 50
    SDP_SUBARRAY_LEAF_NODE_COMMAND_TIMEOUT: 30
    CSP_SUBARRAY_LEAF_NODE_COMMAND_TIMEOUT: 30
    DISH_LEAF_NODE_COMMAND_TIMEOUT: 40
    COUNT: 1
    KUBE_NAMESPACE: "ci-$CI_PROJECT_NAME-$CI_COMMIT_SHORT_SHA"
  script:
    - make k8s-test MARK="batch1"
  before_script:
    - make cred SERVICE_ACCOUNT=$SERVICE_ACCOUNT
    - '[ -f .make/k8s.mk ] || (echo "File k8s.mk not included in Makefile; exit 1")'
    - make k8s-install-chart
    - make k8s-wait
  after_script:
    - pip3 install -q -U git+https://gitlab.com/ska-telescope/ska-ser-xray.git
    - XRAY_TEST_RESULT_FILE="build/cucumber.json" make xray-publish
    
k8s-test-mid-restart:
  extends:
    - k8s-test
  variables:
    SERVICE_ACCOUNT: "ci-svc-$CI_PROJECT_NAME-$CI_COMMIT_SHORT_SHA-tmc-mid-restart"
    DISH_SIMULATION_ENABLED: "true"
    SUBARRAY_COUNT: 2
    SUBARRAY_COMMAND_TIMEOUT: 50
    SDP_SUBARRAY_LEAF_NODE_COMMAND_TIMEOUT: 30
    CSP_SUBARRAY_LEAF_NODE_COMMAND_TIMEOUT: 30
    DISH_LEAF_NODE_COMMAND_TIMEOUT: 40
    COUNT: 1
    KUBE_NAMESPACE: "ci-$CI_PROJECT_NAME-$CI_COMMIT_SHORT_SHA-tmc-mid-restart"
  script:
    - make k8s-test MARK="SKA_tmc_mid_restart"
  environment:
    name: test/$CI_COMMIT_REF_SLUG
    on_stop: stop-k8s-test-tmc-mid-restart

stop-k8s-test-tmc-mid-restart:
  extends:
    - stop-k8s-test
  variables:
    KUBE_NAMESPACE: "ci-$CI_PROJECT_NAME-$CI_COMMIT_SHORT_SHA-tmc-mid-restart"

k8s-test-mid-restart-device:
  extends:
    - k8s-test
  variables:
    SERVICE_ACCOUNT: "ci-svc-$CI_PROJECT_NAME-$CI_COMMIT_SHORT_SHA-tmc-mid-restart-device"
    DISH_SIMULATION_ENABLED: "true"
    SUBARRAY_COUNT: 2
    SUBARRAY_COMMAND_TIMEOUT: 50
    SDP_SUBARRAY_LEAF_NODE_COMMAND_TIMEOUT: 30
    CSP_SUBARRAY_LEAF_NODE_COMMAND_TIMEOUT: 30
    DISH_LEAF_NODE_COMMAND_TIMEOUT: 40
    COUNT: 1
    KUBE_NAMESPACE: "ci-$CI_PROJECT_NAME-$CI_COMMIT_SHORT_SHA-tmc-mid-restart-device"
  script:
    - make k8s-test MARK="SKA_tmc_mid_device_restart"
  environment:
    name: test/$CI_COMMIT_REF_SLUG
    on_stop: stop-k8s-test-tmc-mid-restart-device

stop-k8s-test-tmc-mid-restart-device:
  extends:
    - stop-k8s-test
  variables:
    KUBE_NAMESPACE: "ci-$CI_PROJECT_NAME-$CI_COMMIT_SHORT_SHA-tmc-mid-restart-device"

k8s-test-batch2:
  extends:
    - k8s-test
  variables:
    SERVICE_ACCOUNT: "ci-svc-$CI_PROJECT_NAME-$CI_COMMIT_SHORT_SHA-batch2"
    DISH_SIMULATION_ENABLED: "true"
    SUBARRAY_COUNT: 2
    COUNT: 1
    SUBARRAY_COMMAND_TIMEOUT: 50
    SDP_SUBARRAY_LEAF_NODE_COMMAND_TIMEOUT: 30
    CSP_SUBARRAY_LEAF_NODE_COMMAND_TIMEOUT: 30
    DISH_LEAF_NODE_COMMAND_TIMEOUT: 40
    KUBE_NAMESPACE: "ci-$CI_PROJECT_NAME-$CI_COMMIT_SHORT_SHA-batch2"
  script:
    - make k8s-test MARK="batch2"
  environment:
    name: test/$CI_COMMIT_REF_SLUG-batch2
    on_stop: stop-k8s-test-batch2
    auto_stop_in: 1 minute

stop-k8s-test-batch2:
  extends:
    - stop-k8s-test
  variables:
    KUBE_NAMESPACE: "ci-$CI_PROJECT_NAME-$CI_COMMIT_SHORT_SHA-batch2"
  environment:
    name: test/$CI_COMMIT_REF_SLUG-batch2
    action: stop

k8s-tmc-scaling:
  stage: scaling
  when: manual
  extends:
    - k8s-test
  tags:
    - ska-staging-tmc
  variables:
    DEPLOY_ALL_DISHES: "true"
    DISH_SIMULATION_ENABLED: "true"
    SUBARRAY_COUNT: 4
    COUNT: 1
    KUBE_NAMESPACE: "staging-ska-tmc-mid"
    K8S_TIMEOUT: "1800s"
    TARANTA_ENABLED: "true"
  script:
    - make taranta-link
  environment:
    name: ska-tmc-staging-env
    auto_stop_in: never
    on_stop: stop-k8s-tmc-scaling

stop-k8s-tmc-scaling:
  stage: scaling
  extends:
    - stop-k8s-test
  tags:
    - ska-staging-tmc
  variables:
    KUBE_NAMESPACE: "staging-ska-tmc-mid"
  environment:
    name: ska-tmc-staging-env
    action: stop
  when: manual
