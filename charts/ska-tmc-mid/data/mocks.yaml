name: "mocks-{{.Release.Name}}"
function: testing
domain: mocks
instances:
  - "01"
  - "02"
  - "03"
  - "04"
  - "05"
{{- range .Values.global.dishids }}
  {{- $num := regexReplaceAll "^[A-Za-z]+" . "" }}
  - "{{ $num }}"
{{- end }}

{{- $midSdpControlFqdn := .Values.global.sdp_master }}
{{- $midSdpQueueConnector := .Values.global.mid_sdp_queueconnector }}
{{- $midCspControl := .Values.global.mid_csp_control }}
{{- $dishManagerSuffix := .Values.global.dish_manager_suffix }}
{{- $subCount := int .Values.subarray_count }}
{{- $sdpPrefix := .Values.global.sdp_subarray_prefix }}
{{- $cspPrefix := .Values.global.csp_subarray_prefix }}

entrypoints:
  - name: "ska_tmc_simulators.helper_base_device.HelperBaseDevice"
  - name: "ska_tmc_simulators.helper_dish_device.HelperDishDevice"
  - name: "ska_tmc_simulators.helper_subarray_device.HelperSubArrayDevice"
  - name: "ska_tmc_simulators.helper_csp_subarray_device.HelperCSPSubarrayDevice"
  - name: "ska_tmc_simulators.helper_csp_master_device.HelperCspMasterDevice"
  - name: "ska_tmc_simulators.helper_sdp_subarray.HelperSdpSubarray"
  - name: "ska_tmc_simulators.helper_sdp_queue_connector_device.HelperSdpQueueConnector"
server:
  name: "mocks"
  instances:
      {{- $isSimulatedDish := .Values.deviceServers.mocks.dish }}
      {{- $isSimulatedCsp := .Values.deviceServers.mocks.csp }}
      {{- $isSimulatedSdp := .Values.deviceServers.mocks.sdp }}
      {{- if eq $isSimulatedSdp true }}
    - name: "01"
      classes:
        - name: "HelperBaseDevice"
          devices:
          - name: "{{ $midSdpControlFqdn }}"
    - name: "02"
      classes:
        - name: "HelperSdpSubarray"
          devices:
          {{- range $i, $_ := until $subCount }}
            {{- $idx := printf "%02d" (add $i 1) }}
            - name: "{{ $sdpPrefix }}/{{ $idx }}"
          {{- end }}
    - name: "03"
      classes:
        - name: "HelperSdpQueueConnector"
          devices:
          - name: "{{ $midSdpQueueConnector }}"
      {{- end }}

      {{- if eq $isSimulatedCsp true }}
    - name: "04"
      classes:
        - name: "HelperCspMasterDevice"
          devices:
          - name: "{{ $midCspControl }}"
    - name: "05"
      classes:
        - name: "HelperCSPSubarrayDevice"
          devices:
          {{- range $i, $_ := until $subCount }}
            {{- $idx := printf "%02d" (add $i 1) }}
            - name: "{{ $cspPrefix }}/{{ $idx }}"
          {{- end }}
      {{- end }}
      {{- if eq $isSimulatedDish true }}
{{- range .Values.global.dishids }}
  {{- $num := regexReplaceAll "^[A-Za-z]+" . "" }}
    - name: "{{ $num }}"
      classes:
        - name: "HelperDishDevice"
          devices:
            - name: "{{ $dishManagerSuffix }}{{ $num }}"
{{- end }}
      {{- end }}
depends_on:
  - device: sys/database/2
image:
  registry: "{{.Values.skatmcsimulators.image.registry}}"
  image: "{{.Values.skatmcsimulators.image.image}}"
  tag: "{{.Values.skatmcsimulators.image.tag}}"
  pullPolicy: "{{.Values.skatmcsimulators.image.pullPolicy}}"
